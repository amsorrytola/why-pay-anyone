<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why Pay Anyone? Presentation deck</title>
<!-- The deck is drawn frame by frame by render.mjs: renderFrame(n) sets every element for frame n. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #fff; }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fff; color: #1b1c1e;
    font-family: "Source Serif 4", Georgia, serif; font-optical-sizing: auto; font-kerning: normal;
    -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
  }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.14em; margin-bottom: -0.14em; }
  .w > span { display: inline-block; }
  .num { font-variant-numeric: tabular-nums lining-nums; }
  svg text { font-variant-numeric: tabular-nums lining-nums; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="timeline.js"></script>
<script src="data.js"></script>
<script src="deck.js"></script>
</body>
</html>
